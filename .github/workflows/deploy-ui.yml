name: Deploy UI to Railway

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (staging|production)'
        required: true
        default: 'staging'

env:
  RAILWAY_PROJECT_ID: 70472fbf-60d6-4ada-99ff-114188b18939
  UI_SERVICE_NAME: UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Railway CLI
        run: npm i -g @railway/cli@^4

      - name: Link project
        run: railway link --project $RAILWAY_PROJECT_ID --team "Alex de Pablos's Projects" --service "$UI_SERVICE_NAME"

      - name: Select environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          else
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TARGET_ENV="production"
            else
              TARGET_ENV="staging"
            fi
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: Link environment
        run: railway environment ${{ steps.env.outputs.TARGET_ENV }}

      - name: Deploy to Railway
        run: railway up --service "$UI_SERVICE_NAME" --ci

      - name: Optional smoke test (UI)
        if: ${{ env.UI_SMOKE_URL != '' }}
        env:
          UI_SMOKE_URL: ${{ secrets.UI_SMOKE_URL }}
        run: |
          echo "Hitting $UI_SMOKE_URL ..."
          curl -fsSL --retry 6 --retry-delay 5 "$UI_SMOKE_URL" >/dev/null
          echo "UI smoke test OK"






